spring:
  application:
    name: pg-perf-mcp
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${PGPERF_DB_URL:jdbc:postgresql://localhost:5432/shop}
    username: ${PGPERF_DB_USER:mcp_readonly}
    password: ${PGPERF_DB_PASSWORD:}
    hikari:
      pool-name: pgperf-readonly
      # Every pooled connection is read-only at the JDBC level and the session itself defaults to
      # read-only transactions, independent of the role settings on the server.
      read-only: true
      # Must stay true: with auto-commit off, the init SQL below leaves a transaction open on every
      # new connection and the transaction manager can no longer set the isolation level. The
      # transaction manager switches auto-commit off itself for each ReadOnlyExecutor call.
      auto-commit: true
      connection-init-sql: SET SESSION CHARACTERISTICS AS TRANSACTION READ ONLY
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 5000
      validation-timeout: 2000
      data-source-properties:
        ApplicationName: pg-perf-mcp

  ai:
    mcp:
      server:
        name: pg-perf-mcp
        version: "@project.version@"  # from pom.xml at build time
        type: SYNC
        protocol: STREAMABLE
        instructions: >-
          Read-only PostgreSQL performance diagnostics. Start with top_slow_queries, then explain_query and
          suggest_indexes on the worst statement, and table_health / unused_indexes / blocking_sessions for
          context, and slow_functions / explain_function when slow statements call database functions. Nothing
          here can modify the database; index suggestions are text for a human to review.
        capabilities:
          tool: true
          resource: true
          prompt: true
          completion: false
        streamable-http:
          mcp-endpoint: /mcp

server:
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

pgperf:
  security:
    # Clients must send "Authorization: Bearer <MCP_API_KEY>". Startup fails if it is missing.
    api-key: ${MCP_API_KEY:}
  guard:
    max-sql-length: 20000
  query:
    statement-timeout: 5s
    max-rows: 200
  functions:
    # explain_function: capture the plan of a statement inside a function when one execution
    # takes at least this long. Every execution is counted either way.
    nested-plan-threshold: 1ms

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # Health is the only unauthenticated endpoint, so it never reveals component details.
      show-details: never
  tracing:
    # OpenTelemetry tracing is opt-in: OTEL_TRACING_ENABLED=true exports spans via OTLP/HTTP.
    enabled: ${OTEL_TRACING_ENABLED:false}
    sampling:
      probability: ${OTEL_TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  otlp:
    metrics:
      export:
        # Metrics are scraped from /actuator/prometheus instead of pushed.
        enabled: false
  logging:
    export:
      otlp:
        enabled: false
