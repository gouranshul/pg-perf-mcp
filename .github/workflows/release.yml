name: Release

# Push a tag like v0.1.0 to publish ghcr.io/gouranshul/pg-perf-mcp (amd64 + arm64) and a GitHub
# release. The tag, pom.xml and server.json must carry the same version.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    name: Publish image and release
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub release
      packages: write   # push to ghcr.io
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Check that tag, pom.xml and server.json agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pom="$(./mvnw -B -q help:evaluate -Dexpression=project.version -DforceStdout)"
          server="$(jq -r .version server.json)"
          image="$(jq -r '.packages[0].identifier' server.json)"
          echo "tag=$tag pom=$pom server.json=$server image=$image"
          [[ "$pom" == "$tag" && "$server" == "$tag" && "$image" == "ghcr.io/${GITHUB_REPOSITORY}:$tag" ]] \
            || { echo "::error::Versions differ. Update pom.xml and server.json before tagging."; exit 1; }

      - name: Verify
        run: ./mvnw -B verify

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
