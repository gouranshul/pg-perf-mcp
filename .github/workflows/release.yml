name: Release

# Push a tag like v0.1.0 to publish ghcr.io/gouranshul/pg-perf-mcp (amd64 + arm64) and a GitHub
# release. The tag, pom.xml and server.json must carry the same version.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    name: Publish image and release
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub release
      packages: write   # push to ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Check that tag, pom.xml and server.json agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pom="$(./mvnw -B -q help:evaluate -Dexpression=project.version -DforceStdout)"
          server="$(jq -r .version server.json)"
          image="$(jq -r '.packages[0].identifier' server.json)"
          echo "tag=$tag pom=$pom server.json=$server image=$image"
          [[ "$pom" == "$tag" && "$server" == "$tag" && "$image" == "ghcr.io/${GITHUB_REPOSITORY}:$tag" ]] \
            || { echo "::error::Versions differ. Update pom.xml and server.json before tagging."; exit 1; }

      - name: Verify
        run: ./mvnw -B verify

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
